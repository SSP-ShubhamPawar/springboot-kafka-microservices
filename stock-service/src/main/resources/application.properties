spring.application.name=stock-service
server.port=8083
spring.kafka.consumer.bootstrap-servers:localhost:9092
spring.kafka.consumer.group-id:stock
spring.kafka.listner.auto-startup:false
spring.kafka.consumer.auto-offset-reset:earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Wrap the standard deserializer in the ErrorHandling wrapper
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
# Tell the wrapper which actual delegate deserializer it should execute
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.topic.name=order_topics


# Keep your trusted packages declaration active
spring.kafka.consumer.properties.spring.json.trusted.packages=net.javaguides.basedomains.dto
